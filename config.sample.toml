[user]

provider = "slack"

## Here we define all your status presets

# The preset "eat" can be triggered using command `afk eat`
[presets.eat]
# Default Config for eat
text = "On Lunch"
duration = "1h"
emojis = ["cook", "knife_fork_plate", "sandwich", "stuffed_flatbread"]
# Day Specific Config for eat
schedule = [
    { day = "Monday", text = "Monday left me broken ... 🎶" },
    { day = "Tuesday", text = "Tuesday I was through with hoping ... 🎶" },
    { day = "Wednesday", text = "Wednesday my empty arms were open ... 🎶" },
    { day = "Thursday", text = "Thursday waiting for love, waiting for love ... 🎶" },
    { day = "Friday", text = "Thank the stars it's Friday ... 🎶" },
    # WHY TF are you working on a Saturday??, people died for this bruh (https://en.wikipedia.org/wiki/Haymarket_affair)
    { day = "Saturday", text = "I'm burning like a fire gone wild on Saturday... 🎶" },
]

[presets.afk]
text = "AFK"
duration = "30m"
emojis = [
    "four_leaf_clover",
    "person_in_lotus_position",
    "sunflower",
    "potted_plant",
]
schedule = [{ day = "Friday", text = "Prayer", emojis = ["seedling"] }]

[presets.ooo]
text = "Out of Office"
duration = "3w"
presence = "away"
notifications = "off"
emojis = ["palm_tree", "beach_with_umbrella", "no_entry", "no_bell"]

[presets.travel]
text = "Travelling"
duration = "2h"
emojis = ["airplane", "red_car", "auto_rickshaw"]

[presets.sick]
text = "Out Sick"
duration = "2d"
emojis = [
    "face_with_head_bandage",
    "mask",
    "face_with_thermometer",
    "sneezing_face",
    "microbe",
    "face_with_spiral_eyes",
    "face_with_bags_under_eyes"
]

[presets.med]
text = "Out for a health check-up"
duration = "3h"
emojis = ["pill", "hospital", "mending_heart"]

[presets.crime]
text = "Committing Crime (don't report to HR 🔫)"
duration = "666m"
emojis = ["supervillain", "japanese_goblin", "shushing_face"]

[presets.aura]
text = "Aura Farming (don't tell my mum)"
duration = "35m"
emojis = ["moyai", "male_genie"]

[preset.zon]
text = "Focusing (Locked In) - Please don't disturb with any pings/calls. I'll be back"
duration = "1h"
emojis = ["dart", "headphones", "brain"]
